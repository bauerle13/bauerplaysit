name: Sync videos, series and mods

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run sync
        run: node scripts/sync.mjs
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          PATREON_URL: ${{ vars.PATREON_URL }}
      - name: Commit if changed
        run: |
          if git diff --quiet data/; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "bauerplaysit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Sync videos, series and mods"
          git push